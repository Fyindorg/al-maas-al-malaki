  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n  <!-- PRODUCTS INDEX -->\n  <sc-if value=\"{{ isProducts }}\">\n    <div>\n      <section style=\"padding:56px 0;background:#2f357a\">\n        <div style=\"max-width:1280px;margin:0 auto;padding:0 16px;color:#fff\">\n          <h1 style=\"font-size:36px;font-weight:700;margin:0\">Our Steel Products<\u002Fh1>\n          <p style=\"margin-top:12px;max-width:760px;color:rgba(255,255,255,0.85)\">Al Maas Al Malaki stocks a comprehensive range of steel and building materials — organised into seven core categories. Each category page lists specifications, applications and enquiry options for every product we supply across the UAE and GCC.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"max-width:1280px;margin:0 auto;padding:56px 16px\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px\">\n          <sc-for list=\"{{ categories }}\" as=\"cat\" hint-placeholder-count=\"7\">\n            <a href=\"javascript:void(0)\" sc-camel-on-click=\"{{ cat.onClick }}\" style=\"display:block;overflow:hidden;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.05);border:1px solid #e5e7eb;color:#1f2937;transition:transform 0.3s ease,box-shadow 0.3s ease\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 32px rgba(0,0,0,0.15)\">\n              <div style=\"aspect-ratio:4/3;overflow:hidden\">\n                <img src=\"{{ cat.image }}\" alt=\"{{ cat.name }} — Al Maas Al Malaki UAE\" style=\"height:100%;width:100%;object-fit:cover\">\n              <\u002Fdiv>\n              <div style=\"padding:20px\">\n                <h2 style=\"font-weight:700;font-size:18px;color:#2f357a;margin:0\">{{ cat.name }}<\u002Fh2>\n                <p style=\"margin-top:4px;font-size:14px;color:#6b7280\">{{ cat.short }}<\u002Fp>\n                <div style=\"margin-top:12px;font-size:12px;color:#6b7280\">{{ cat.productCount }} products<\u002Fdiv>\n                <span style=\"margin-top:12px;display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:#ECBE07\">View Category →<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- CATEGORY PAGE -->\n  <sc-if value=\"{{ isCategory }}\">\n    <div>\n      <section style=\"padding:48px 0;background:#2f357a\">\n        <div style=\"max-width:1280px;margin:0 auto;padding:0 16px;color:#fff\">\n          <nav style=\"font-size:12px;color:rgba(255,255,255,0.7);display:flex;align-items:center;gap:6px;margin-bottom:12px\">\n            <a href=\"javascript:void(0)\" sc-camel-on-click=\"{{ goHome }}\" style=\"color:rgba(255,255,255,0.7)\">Home<\u002Fa><span>›<\u002Fspan>\n            <a href=\"javascript:void(0)\" sc-camel-on-click=\"{{ goProducts }}\" style=\"color:rgba(255,255,255,0.7)\">Products<\u002Fa><span>›<\u002Fspan>\n            <span>{{ currentCategory.name }}<\u002Fspan>\n          <\u002Fnav>\n          <h1 style=\"font-size:36px;font-weight:700;margin:0\">{{ currentCategory.name }}<\u002Fh1>\n          <p style=\"margin-top:16px;max-width:900px;color:rgba(255,255,255,0.9);line-height:1.7\">{{ currentCategory.intro }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"max-width:1280px;margin:0 auto;padding:56px 16px\">\n        <h2 style=\"font-size:24px;font-weight:700;color:#2f357a;margin:0 0 24px 0\">{{ currentCategory.name }} Product Range<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px\">\n          <sc-for list=\"{{ currentCategory.products }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <a href=\"javascript:void(0)\" sc-camel-on-click=\"{{ p.onReadMore }}\" style=\"display:block;overflow:hidden;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.05);border:1px solid #e5e7eb;color:#1f2937;transition:transform 0.3s ease,box-shadow 0.3s ease\" style-hover=\"transform:translateY(-6px);box-shadow:0 16px 32px rgba(0,0,0,0.15)\">\n              <div style=\"aspect-ratio:4/3;overflow:hidden;background:#f3f4f6\">\n                <img src=\"{{ p.cardImage }}\" alt=\"{{ p.name }} supplier UAE – Al Maas Al Malaki\" style=\"height:100%;width:100%;object-fit:cover\">\n              <\u002Fdiv>\n              <div style=\"padding:20px\">\n                <h3 style=\"font-weight:600;color:#2f357a;margin:0\">{{ p.name }}<\u002Fh3>\n                <p style=\"margin-top:4px;font-size:14px;color:#6b7280\">{{ p.teaser }}<\u002Fp>\n                <span style=\"margin-top:12px;display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:#ECBE07\">Read More →<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ABOUT -->\n  <sc-if value=\"{{ isAbout }}\">\n    <div>\n      <section style=\"padding:56px 0;background:#2f357a\">\n        <div style=\"max-width:1280px;margin:0 auto;padding:0 16px;color:#fff\">\n          <h1 style=\"font-size:36px;font-weight:700;margin:0\">About Al Maas Al Malaki<\u002Fh1>\n          <p style=\"margin-top:12px;max-width:760px;color:rgba(255,255,255,0.85)\">A trusted name in steel trading — stockist, importer, exporter and supplier — serving the UAE and GCC.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"max-width:1280px;margin:0 auto;padding:56px 16px;display:grid;grid-template-columns:2fr 1fr;gap:40px\">\n        <div style=\"color:#374151;line-height:1.7;display:flex;flex-direction:column;gap:16px\">\n          <h2 style=\"font-size:24px;font-weight:700;color:#2f357a;margin:0\">Our Story<\u002Fh2>\n          <p>Founded to serve the growing infrastructure and construction market of the UAE, {{ company.name }} has grown into an established steel trading company with a solid reputation for reliability, quality and service. From our headquarters and stockyard in Al Sajaa Industrial Area, Sharjah, we handle the full spectrum of steel trading — stockist, importer, exporter and supplier — across every major product category the industry needs.<\u002Fp>\n          <p>Our clients include EPC contractors, fabricators, workshops, oil &amp; gas service companies, marine operators, HVAC and roofing contractors, and OEMs across the UAE, Saudi Arabia, Oman, Qatar, Kuwait and Bahrain. What ties them together is a need for dependable supply of certified steel — and that is exactly what we deliver.<\u002Fp>\n          <h2 style=\"font-size:24px;font-weight:700;color:#2f357a;margin:16px 0 0 0\">What We Offer<\u002Fh2>\n          <p>Structural steel, mild steel (MS) products, steel pipes and tubes, sheets and coils, stainless steel, aluminium and mesh &amp; gratings — all backed by mill test certificates and traceability. Whether you need a single beam ex-stock or bulk indent supply of coils and plates, our commercial and logistics team is ready to help.<\u002Fp>\n          <h2 style=\"font-size:24px;font-weight:700;color:#2f357a;margin:16px 0 0 0\">Why Customers Trust Us<\u002Fh2>\n          <ul style=\"padding-left:22px;margin:0;display:flex;flex-direction:column;gap:8px\">\n            <li>Wide, ready stock across seven product categories<\u002Fli>\n            <li>Certified quality — EN 10204 3.1 mill test certificates<\u002Fli>\n            <li>Transparent, competitive pricing<\u002Fli>\n            <li>GCC-wide delivery from our Sharjah stockyard<\u002Fli>\n            <li>24/7 enquiry response via WhatsApp and email<\u002Fli>\n            <li>Personalised service from an experienced trading team<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <aside style=\"display:flex;flex-direction:column;gap:16px\">\n          <sc-for list=\"{{ aboutCards }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"border-radius:8px;border:1px solid #e5e7eb;padding:20px\">\n              <div style=\"width:28px;height:28px;border-radius:6px;background:#ECBE07\"><\u002Fdiv>\n              <div style=\"margin-top:12px;font-weight:600;color:#2f357a\">{{ c.t }}<\u002Fdiv>\n              <div style=\"font-size:14px;color:#6b7280;margin-top:4px\">{{ c.d }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <a href=\"javascript:void(0)\" sc-camel-on-click=\"{{ goContact }}\" style=\"display:block;text-align:center;border-radius:6px;padding:12px 24px;font-size:14px;font-weight:700;color:#2f357a;background:#ECBE07\">Get In Touch<\u002Fa>\n        <\u002Faside>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- CONTACT -->\n  <sc-if value=\"{{ isContact }}\">\n    <div>\n      <section style=\"padding:56px 0;background:#2f357a\">\n        <div style=\"max-width:1280px;margin:0 auto;padding:0 16px;color:#fff\">\n          <h1 style=\"font-size:36px;font-weight:700;margin:0\">Contact Us<\u002Fh1>\n          <p style=\"margin-top:12px;max-width:760px;color:rgba(255,255,255,0.85)\">Get in touch for pricing, availability, mill certificates and delivery options across the UAE and GCC.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"max-width:1280px;margin:0 auto;padding:56px 16px;display:grid;grid-template-columns:2fr 1fr;gap:40px\">\n        <div style=\"border-radius:12px;border:1px solid #e5e7eb;padding:32px;background:#fff\">\n          <h2 style=\"font-size:24px;font-weight:700;color:#2f357a;margin:0\">Send Us a Message<\u002Fh2>\n          <form sc-camel-on-submit=\"{{ onContactSubmit }}\" style=\"margin-top:20px;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px\">\n              <div>\n                <label style=\"font-size:14px;font-weight:600;color:#374151\">Name <span style=\"color:#dc2626\">*<\u002Fspan><\u002Flabel>\n                <input ref=\"{{ contactNameRef }}\" type=\"text\" required=\"true\" maxlength=\"200\" style=\"margin-top:4px;width:100%;border-radius:6px;border:1px solid #d1d5db;padding:8px 12px;box-sizing:border-box\">\n              <\u002Fdiv>\n              <div>\n                <label style=\"font-size:14px;font-weight:600;color:#374151\">Email <span style=\"color:#dc2626\">*<\u002Fspan><\u002Flabel>\n                <input ref=\"{{ contactEmailRef }}\" type=\"email\" required=\"true\" maxlength=\"200\" style=\"margin-top:4px;width:100%;border-radius:6px;border:1px solid #d1d5db;padding:8px 12px;box-sizing:border-box\">\n              <\u002Fdiv>\n              <div>\n                <label style=\"font-size:14px;font-weight:600;color:#374151\">Phone<\u002Flabel>\n                <input ref=\"{{ contactPhoneRef }}\" type=\"tel\" maxlength=\"200\" style=\"margin-top:4px;width:100%;border-radius:6px;border:1px solid #d1d5db;padding:8px 12px;box-sizing:border-box\">\n              <\u002Fdiv>\n              <div>\n                <label style=\"font-size:14px;font-weight:600;color:#374151\">Subject<\u002Flabel>\n                <input type=\"text\" maxlength=\"200\" style=\"margin-top:4px;width:100%;border-radius:6px;border:1px solid #d1d5db;padding:8px 12px;box-sizing:border-box\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <label style=\"font-size:14px;font-weight:600;color:#374151\">Message<\u002Flabel>\n              <textarea ref=\"{{ contactMessageRef }}\" required=\"true\" rows=\"5\" maxlength=\"2000\" style=\"margin-top:4px;width:100%;border-radius:6px;border:1px solid #d1d5db;padding:8px 12px;box-sizing:border-box;font-family:inherit\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <button type=\"submit\" style=\"justify-self:start;display:inline-flex;align-items:center;gap:8px;border-radius:6px;padding:12px 24px;font-size:14px;font-weight:700;color:#2f357a;background:#ECBE07;border:none;cursor:pointer;width:fit-content\">Send Enquiry<\u002Fbutton>\n            <sc-if value=\"{{ isSent }}\">\n              <p style=\"font-size:14px;color:#15803d;margin:0\">Opening your email client — thank you!<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fform>\n        <\u002Fdiv>\n        <aside style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"border-radius:8px;border:1px solid #e5e7eb;padding:20px\">\n            <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#6b7280\">Address<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:14px;color:#1f2937\">{{ company.address }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-radius:8px;border:1px solid #e5e7eb;padding:20px\">\n            <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#6b7280\">Phone<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:14px\"><a href=\"{{ company.phoneHref }}\" style=\"color:#1f2937\">{{ company.phone }}<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-radius:8px;border:1px solid #e5e7eb;padding:20px\">\n            <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#6b7280\">Mobile<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:14px\"><a href=\"{{ company.mobileHref }}\" style=\"color:#1f2937\">{{ company.mobile }}<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-radius:8px;border:1px solid #e5e7eb;padding:20px\">\n            <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#6b7280\">Email<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:14px;word-break:break-all\"><a href=\"mailto:{{ company.email }}\" style=\"color:#1f2937\">{{ company.email }}<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-radius:8px;border:1px solid #e5e7eb;padding:20px\">\n            <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#6b7280\">Working Hours<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:14px;color:#1f2937\">{{ company.hours }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Faside>\n      <\u002Fsection>\n      <section style=\"max-width:1280px;margin:0 auto;padding:0 16px 64px 16px\">\n        <h2 style=\"font-size:24px;font-weight:700;color:#2f357a;margin:0 0 16px 0\">Find Us<\u002Fh2>\n        <div style=\"position:relative;width:100%;height:420px;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb\">\n          <iframe title=\"Al Maas Al Malaki location on Google Maps\" src=\"{{ company.mapsEmbed }}\" style=\"width:100%;height:100%;border:0\" loading=\"lazy\" referrerpolicy=\"no-referrer-when-downgrade\"><\u002Fiframe>\n          <a href=\"{{ company.mapsLink }}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;border-radius:6px;padding:12px 24px;font-size:14px;font-weight:700;color:#2f357a;background:#ECBE07;box-shadow:0 2px 8px rgba(0,0,0,0.2)\">Open in Maps<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <!-- QUICK VIEW MODAL -->\n  <sc-if value=\"{{ hasQuickView }}\">\n    <div sc-camel-on-click=\"{{ closeQuickView }}\" style=\"position:fixed;inset:0;z-index:200;background:rgba(15,17,42,0.6);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto\">\n      <div sc-camel-on-click=\"{{ stopPropagation }}\" style=\"background:#fff;border-radius:12px;max-width:900px;width:100%;max-height:90vh;display:flex;flex-direction:column;position:relative\">\n        <button sc-camel-on-click=\"{{ closeQuickView }}\" aria-label=\"Close\" style=\"position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;font-size:18px;line-height:1;cursor:pointer; 240\" }, { label: \"Certification\", value: \"EN 10204 3.1 MTC\" }], applications: [\"Architecture\", \"Kitchens\", \"Food processing\", \"Marine\"] },\n        { slug: \"ss-round-bars\", name: \"Stainless Steel Round Bars\", teaser: \"SS round bars for shafting, fasteners and machining.\", description: \"Stainless steel round bars in bright-drawn and peeled finishes for shafts, fasteners, pump parts and precision machining. Full traceability with MTC.\", specs: [{ label: \"Grade\", value: \"SS 304 / 316 / 316L / 410 / 431\" }, { label: \"Diameter\", value: \"3 mm – 200 mm\" }, { label: \"Length\", value: \"3m / 6m\" }, { label: \"Finish\", value: \"Bright drawn / Peeled\" }, { label: \"Standard\", value: \"ASTM A276 / EN 10088\" }, { label: \"Application\", value: \"Shafts, fasteners, pump parts\" }], applications: [\"Shafting\", \"Fasteners\", \"Machining\", \"Pump parts\"] },\n        { slug: \"stainless-steel-products-item\", name: \"General Stainless Steel Products\", teaser: \"SS pipes, tubes, angles, flats and fittings on request.\", description: \"In addition to our stock SS sheets and round bars, we source SS pipes, tubes, angles, flat bars and pipe fittings on request in 304 and 316 grades — with quick lead times across the UAE and GCC.\", specs: [{ label: \"Grade\", value: \"SS 304 / 316\" }, { label: \"Product Range\", value: \"Pipes, tubes, angles, flats, fittings\" }, { label: \"Standard\", value: \"ASTM A312 / A554 / A276\" }, { label: \"Finish\", value: \"Pickled / Polished / No.4\" }, { label: \"Lead Time\", value: \"Ex-stock / 1–2 weeks indent\" }, { label: \"Certification\", value: \"EN 10204 3.1 MTC\" }], applications: [\"Process industry\", \"Chemical\", \"Marine\", \"Architecture\"] },\n      ],\n    },\n    {\n      slug: \"aluminum-products\", name: \"Aluminum Products\",\n      short: \"Aluminium sheets and chequered plates in marine and architectural grades.\",\n      image: \"assets/cat-aluminum.jpg\",\n      intro: \"Al Maas Al Malaki supplies aluminium sheets and chequered plates in marine and architectural grades for the UAE and GCC market. Our aluminium products serve marine, transport, cladding, HVAC and lightweight fabrication needs — corrosion-resistant, easy to form and long-lasting.\",\n      products: [\n        { slug: \"aluminum-sheets\", name: \"Aluminum Sheets\", teaser: \"Plain aluminium sheets in 1050, 3003, 5052 and 6061 grades.\", description: \"Plain aluminium sheets for cladding, signage, transport bodies, HVAC and lightweight fabrication. Available in mill finish and PE-coated variants.\", specs: [{ label: \"Alloy\", value: \"1050 / 3003 / 5052 / 6061\" }, { label: \"Thickness\", value: \"0.5 mm – 6 mm\" }, { label: \"Size\", value: \"1000 x 2000 / 1250 x 2500 mm\" }, { label: \"Temper\", value: \"H14 / H24 / T6\" }, { label: \"Finish\", value: \"Mill finish / PE-coated\" }, { label: \"Standard\", value: \"EN 573 / ASTM B209\" }], applications: [\"Cladding\", \"Signage\", \"Transport\", \"HVAC\"] },\n        { slug: \"aluminum-chequered-sheets\", name: \"Aluminum Chequered Sheets\", teaser: \"5-bar aluminium chequered plates for flooring and treads.\", description: \"Aluminium chequered sheets with a 5-bar tread pattern — lightweight, corrosion-resistant and anti-skid — used for flooring, stair treads, vehicle floors and toolboxes.\", specs: [{ label: \"Alloy\", value: \"3003 / 5052\" }, { label: \"Pattern\", value: \"5-bar tread\" }, { label: \"Thickness\", value: \"1.5 mm – 6 mm\" }, { label: \"Size\", value: \"1250 x 2500 mm\" }, { label: \"Finish\", value: \"Mill finish\" }, { label: \"Application\", value: \"Flooring, treads, vehicle floors\" }], applications: [\"Flooring\", \"Stair treads\", \"Vehicles\", \"Toolboxes\"] },\n      ],\n    },\n    {\n      slug: \"mesh-gratings\", name: \"Mesh & Gratings\",\n      short: \"Expanded metal mesh, MS mesh, steel mesh and channel gratings.\",\n      image: \"assets/cat-mesh.jpg\",\n      intro: \"Al Maas Al Malaki supplies expanded metal mesh, welded steel mesh, MS expanded mesh and channel gratings across the UAE and GCC. Our mesh and gratings products are used for walkways, platforms, façades, safety screens, drainage covers and industrial flooring — engineered for load, slip resistance and long service life.\",\n      products: [\n        { slug: \"expanded-metal-mesh\", name: \"Expanded Metal Mesh\", teaser: \"Diamond-pattern expanded mesh for security, façades and walkways.\", description: \"Expanded metal mesh cut and stretched from single sheets — no welds, high strength-to-weight ratio — used for façades, security screens, walkways and safety guards.\", specs: [{ label: \"Material\", value: \"Mild steel / SS 304 / Aluminium\" }, { label: \"Pattern\", value: \"Diamond / Hexagonal\" }, { label: \"Sheet Size\", value: \"1250 x 2500 mm\" }, { label: \"Strand Thickness\", value: \"1.5 mm – 6 mm\" }, { label: \"Finish\", value: \"Mill / Galvanised / Painted\" }, { label: \"Application\", value: \"Façades, walkways, security\" }], applications: [\"Façades\", \"Walkways\", \"Security screens\", \"Guards\"] },\n        { slug: \"ms-expanded-metal-mesh\", name: \"MS Expanded Metal Mesh\", teaser: \"Mild steel expanded mesh in standard and heavy-duty variants.\", description: \"Mild steel expanded metal mesh in standard and heavy-duty variants — ideal for platforms, ramps, safety screens and general industrial fabrication.\", specs: [{ label: \"Material\", value: \"Mild steel (S235JR)\" }, { label: \"Pattern\", value: \"Diamond expanded\" }, { label: \"Sheet Size\", value: \"1220 x 2440 / 1250 x 2500 mm\" }, { label: \"Thickness\", value: \"2 mm – 6 mm\" }, { label: \"Finish\", value: \"Black / Galvanised\" }, { label: \"Standard\", value: \"ASTM F1267\" }], applications: [\"Platforms\", \"Ramps\", \"Safety screens\", \"Fabrication\"] },\n        { slug: \"steel-mesh\", name: \"Steel Mesh (Welded)\", teaser: \"Welded steel wire mesh in panels and rolls.\", description: \"Welded steel wire mesh for reinforcement, fencing, cages, partitions and general construction — supplied in panels and rolls with consistent square openings.\", specs: [{ label: \"Type\", value: \"Welded wire mesh — panels & rolls\" }, { label: \"Wire Diameter\", value: \"2 mm – 8 mm\" }, { label: \"Opening\", value: \"25 x 25 mm to 150 x 150 mm\" }, { label: \"Panel Size\", value: \"1200 x 2400 / 2000 x 3000 mm\" }, { label: \"Finish\", value: \"Black / Galvanised / PVC-coated\" }, { label: \"Application\", value: \"Reinforcement, fencing, cages\" }], applications: [\"Reinforcement\", \"Fencing\", \"Cages\", \"Partitions\"] },\n      ],\n    },\n  ];\n\n  goHome = () => { this.setState({ page: \"home\", mobileNavOpen: false, mobileProdOpen: false }); window.scrollTo(0, 0); };\n  goProducts = () => { this.setState({ page: \"products\", mobileNavOpen: false, mobileProdOpen: false }); window.scrollTo(0, 0); };\n  goAbout = () => { this.setState({ page: \"about\", mobileNavOpen: false, mobileProdOpen: false }); window.scrollTo(0, 0); };\n  goContact = () => { this.setState({ page: \"contact\", mobileNavOpen: false, mobileProdOpen: false }); window.scrollTo(0, 0); };\n  goCategory = (slug) => { this.setState({ page: \"category\", categorySlug: slug, productSlug: null, mobileNavOpen: false, mobileProdOpen: false }); window.scrollTo(0, 0); };\n  openQuickView = (catSlug, prodSlug) => { this.setState({ quickView: { catSlug, prodSlug } }); };\n  goCategoryWithQuickView = (catSlug, prodSlug) => {\n    this.setState({ page: \"category\", categorySlug: catSlug, productSlug: null, mobileNavOpen: false, mobileProdOpen: false, prodOpen: false, quickView: { catSlug, prodSlug } });\n    window.scrollTo(0, 0);\n  };\n  closeQuickView = () => { this.setState({ quickView: null }); };\n  stopPropagation = (e) => { e.stopPropagation(); };\n  goProduct = (catSlug, prodSlug) => { this.openQuickView(catSlug, prodSlug); };\n  toggleMobileNav = () => { this.setState((s) => ({ mobileNavOpen: !s.mobileNavOpen })); };\n  toggleMobileProducts = () => { this.setState((s) => ({ mobileProdOpen: !s.mobileProdOpen })); };\n  toggleFaq = (i) => { this.setState((s) => ({ faqOpen: { ...s.faqOpen, [i]: !s.faqOpen[i] } })); };\n  scrollIndustries = (dx) => { if (this.industriesRef.current) this.industriesRef.current.scrollBy({ left: dx, behavior: \"smooth\" }); };\n\n  onContactSubmit = (e) => {\n    e.preventDefault();\n    const name = (this.nameRef.current?.value || \"\").trim();\n    const email = (this.emailRef.current?.value || \"\").trim();\n    const phone = (this.phoneRef.current?.value || \"\").trim();\n    const message = (this.messageRef.current?.value || \"\").trim();\n    if (!name || !email || !message) return;\n    const body = `Name: ${name}%0APhone: ${phone}%0AEmail: ${email}%0A%0A${encodeURIComponent(message)}`;\n    window.location.href = `mailto:${this.company.email}?subject=Enquiry from ${encodeURIComponent(name)}&body=${body}`;\n    this.setState({ contactStatus: \"sent\" });\n    e.currentTarget.reset();\n  };\n\n  renderVals() {\n    const { page, categorySlug, productSlug, prodOpen, faqOpen, contactStatus, mobileNavOpen, mobileProdOpen, quickView } = this.state;\n\n    const categories = this.categories.map((c) => ({\n      ...c,\n      productCount: c.products.length,\n      onClick: () => this.goCategory(c.slug),\n      topProducts: c.products.slice(0, 3).map((p) => ({ ...p, onClick: () => this.goCategoryWithQuickView(c.slug, p.slug) })),\n    }));\n\n    let currentCategory = null;\n    if (categorySlug) {\n      const catRaw = this.categories.find((c) => c.slug === categorySlug);\n      if (catRaw) {\n        currentCategory = {\n          ...catRaw,\n          onClick: () => this.goCategory(catRaw.slug),\n          products: catRaw.products.map((p) => ({ ...p, cardImage: p.image || catRaw.image, onReadMore: () => this.openQuickView(catRaw.slug, p.slug) })),\n        };\n      }\n    }\n\n    const faqs = this.faqData.map((f, i) => ({ ...f, open: !!faqOpen[i], sign: faqOpen[i] ? \"–\" : \"+\", toggle: () => this.toggleFaq(i) }));\n\n    let quickViewCategory = null, quickViewProduct = null, quickViewEnquireUrl = \"\";\n    if (quickView) {\n      const qCat = this.categories.find((c) => c.slug === quickView.catSlug);\n      if (qCat) {\n        const qProd = qCat.products.find((p) => p.slug === quickView.prodSlug);\n        if (qProd) {\n          quickViewCategory = qCat;\n          quickViewProduct = { ...qProd, cardImage: qProd.image || qCat.image };\n          quickViewEnquireUrl = `https://wa.me/971551893786?text=${encodeURIComponent(\"Hi, I would like to enquire about \" + qProd.name + \".\")}`;\n        }\n      }\n    }\n\n    return {\n      company: this.company,\n      isHome: page === \"home\",\n      isProducts: page === \"products\",\n      isCategory: page === \"category\" && !!currentCategory,\n      isAbout: page === \"about\",\n      isContact: page === \"contact\",\n      hasRelated: false,\n      isSent: contactStatus === \"sent\",\n      categories, industries: this.industries, faqs, features: this.features, aboutCards: this.aboutCards,\n      currentCategory,\n      goHome: this.goHome, goProducts: this.goProducts, goAbout: this.goAbout, goContact: this.goContact,\n      prodOpen,\n      setProdOpenTrue: () => this.setState({ prodOpen: true }),\n      setProdOpenFalse: () => this.setState({ prodOpen: false }),\n      mobileNavOpen, mobileProdOpen,\n      mobileProdSign: mobileProdOpen ? \"−\" : \"+\",\n      toggleMobileNav: this.toggleMobileNav,\n      toggleMobileProducts: this.toggleMobileProducts,\n      scrollLeft: () => this.scrollIndustries(-360),\n      scrollRight: () => this.scrollIndustries(360),\n      industriesRef: this.industriesRef,\n      year: new Date().getFullYear(),\n      contactNameRef: this.nameRef, contactEmailRef: this.emailRef, contactPhoneRef: this.phoneRef, contactMessageRef: this.messageRef,\n      onContactSubmit: this.onContactSubmit,\n      hasQuickView: !!quickViewProduct, quickViewProduct, quickViewCategory, quickViewEnquireUrl,\n      closeQuickView: this.closeQuickView, stopPropagation: this.stopPropagation,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
